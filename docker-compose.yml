
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      VOICEFIXER_URL: http://voicefixer_service:8000
    ports:
      - "3000:3000"
    depends_on:
      - voicefixer_service

  voicefixer_service:
    build:
      context: ./voicefixer_service
      dockerfile: Dockerfile
    # image: epfreedomsolutions/voicefixer:latest
    container_name: voicefixer_service
    restart: unless-stopped
    env_file:
      - ./voicefixer_service/.env
    ports:
      - "8000:8000"

  video_converter_service:
    build:
      context: ./video_converter_service
      dockerfile: Dockerfile
    container_name: video_converter_service
    restart: unless-stopped
    ports:
      - "8010:8000"

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    driver: bridge
