# nginx.conf - Ejemplo para producción
# Rutea:
#   /                → Next.js en localhost:3000
#   /api/voicefixer  → Microservicio en localhost:8010
#   /api/video       → Microservicio en localhost:8020
#
# Incluye buenas prácticas de proxy, headers, gzip y seguridad básica.
# Adapta los valores según tu entorno y necesidades.

user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip compresión
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Seguridad básica
    server_tokens off; # Oculta versión de nginx
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;


    # Tamaño máximo de cuerpo de petición (ajusta según necesidad)
    client_max_body_size 20M;

    # Tiempo de espera de proxy
    proxy_connect_timeout   60s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;
    send_timeout           60s;

    # Proxy headers comunes
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _; # Cambia por tu dominio en producción
        
                # Limita métodos peligrosos
                if ($request_method !~ ^(GET|POST|HEAD|OPTIONS|PUT|DELETE)$ ) {
                    return 444;
                }

        # Redirección HTTP → HTTPS (descomenta si usas SSL)
        # return 301 https://$host$request_uri;

        # Proxy para Next.js (frontend)
        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
            # Websockets y streaming
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
        }

        # Proxy para microservicio voicefixer
        location /api/voicefixer/ {
            proxy_pass http://localhost:8010/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy para microservicio video
        location /api/video/ {
            proxy_pass http://localhost:8020/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }

        # Bloquea archivos ocultos y de backup
        location ~ /\.(?!well-known).* {
            deny all;
        }
        location ~* (\.bak|\.swp|\.tmp)$ {
            deny all;
        }

        # Error pages
        error_page 403 404 500 502 503 504 /custom_50x.html;
        location = /custom_50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}